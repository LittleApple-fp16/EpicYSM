name: Build and release

on:
  push:
    branches: [main, '1.20.1']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read build metadata
        id: metadata
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          case "$minecraft" in
            1.20.1) java=17; loader=Forge ;;
            1.21.1) java=21; loader=NeoForge ;;
            *) echo "Unsupported Minecraft version: $minecraft" >&2; exit 1 ;;
          esac
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version-mc$minecraft" ]]; then
            echo "Release tag does not match gradle.properties" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"
          echo "java=$java" >> "$GITHUB_OUTPUT"
          echo "loader=$loader" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.metadata.outputs.java }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile and run regression tests
        run: bash gradlew --no-daemon --stacktrace build
      - name: Calculate checksums
        working-directory: build/libs
        run: sha256sum *.jar > SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.metadata.outputs.version }}
          MINECRAFT: ${{ steps.metadata.outputs.minecraft }}
          LOADER: ${{ steps.metadata.outputs.loader }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar build/libs/SHA256SUMS.txt \
            --verify-tag \
            --title "EpicYSM $VERSION - Minecraft $MINECRAFT $LOADER" \
            --notes-file .github/release-notes.md
